<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- CodeAtlas 图标：两个节点 + 一条跨域边（虚线），对应产品的核心视觉 -->
  <rect width="32" height="32" rx="7" fill="#1c1a17"/>
  <line x1="10" y1="21" x2="22" y2="11" stroke="#e08a3c" stroke-width="1.8" stroke-dasharray="2.4 2.2" stroke-linecap="round"/>
  <circle cx="10" cy="21" r="4.2" fill="#8ab4f8"/>
  <circle cx="22" cy="11" r="4.2" fill="#f2b880"/>
</svg>
