acceptance_criteria:
  - 每个 subject 至少 80 个 chunk，否则该学科在检索时几乎召不到东西（当前最低 LLM基础 140，达标）
  - 跨域边（两端 domain 不同）不少于 30 条 —— 建库后跑 contracts/db-schema.sql 第四节的统计 SQL
  - 抽取实体数 400-700，三元组 1200-1800
  - 随机抽 20 个 chunk 人工质检，标注准确率 ≥ 85%
