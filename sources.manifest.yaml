# CodeAtlas 素材清单
#
# 本文件是知识库内容的唯一来源声明。仓库不提交任何原始文件，由 scripts/fetch_sources.py 按此拉取。
#
# ⚠️ 许可证策略（提交前必须遵守，这是评委可能抽查的点）：
#   fulltext —— 许可证允许全文使用（Apache-2.0 / MIT），可完整入库
#   excerpt  —— 只做「结构化摘录」：用我们自己的话重写核心章节，保留原文链接与出处
#   summary  —— 只做「一句话摘要 + 链接」，不保留大段原文
#
#   任何 CC-NC（不可商用）、未声明许可证、或来源不明的材料，一律不得 fulltext 入库。

version: 1
updated: 2026-10-23
total_documents: 24
target_chunks: 3500-4000

license_policy:
  fulltext_allowed: [Apache-2.0, MIT, BSD-3-Clause, CC0-1.0]
  excerpt_only: [CC-BY-4.0, CC-BY-SA-4.0, CC-BY-NC-SA-4.0, 官方文档, arXiv 预印本, 个人博客]
  forbidden: [无许可证, 扫描版教材, 培训机构付费资料, 未标注出处的转载]

