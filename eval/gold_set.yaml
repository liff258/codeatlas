# 检索评测集（gold set）

# ## 为什么用关键词而不是人工标注

# 人工标注「这个 chunk 是否相关」最准，但有两个问题：不可复现（换个人标结果不同）、
# 成本高到不可能每改一次切片就重标一遍。

# 这里用**可判定的关键词条件**代替：一个 chunk 算相关，当且仅当它同时包含
# `must_have` 里的所有词、且至少包含 `any_of` 里的一个词。
# 这个标准偏严（会漏掉一些语义相关但用词不同的 chunk），但对**相对比较**是有效的——
# 三种检索模式面对同一套标准，谁高谁低是可信的。

# ## 字段

# - `must_have`：必须同时出现的词（用来锁定主题）
# - `any_of`：至少出现一个（用来锁定"这段确实在讲答案"）
# - `subject`：期望命中的学科，用于检查跨学科误召回

# ## 维护原则

# 新增题目时，先在库里用 SQL 确认确实存在满足条件的 chunk。
# 如果一道题在库里根本没有答案，那它测的是素材覆盖度，不是检索质量，不该放进这里。


cases:
  - id: q01
    question: HashMap 的扩容机制是怎样的
