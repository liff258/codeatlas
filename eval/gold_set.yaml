  # ---- 语义型题：故意不含专业术语，考的是「能不能理解人话」----
  # 这组题用 expect_heading 判定（命中的 chunk 标题里包含指定词之一），
  # 而不是 content 关键词——因为语义题的正确文档往往不含问题里的原词，
  # 用 content 关键词判会系统性判错向量检索。
  - id: s01
